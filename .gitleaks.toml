# gitleaks configuration (the CI "secrets" job runs `gitleaks git`): the default rules, minus one false positive.
# Two synthetic test files carry shader and module records with a "key" field (a shader hash or a module name, not a
# credential), which the generic-api-key rule reads as an API key. Only those two files are allowed; every rule still
# runs on every other file.
[extend]
useDefault = true

[allowlist]
description = "synthetic shader/module records in test fixtures"
paths = [
  '''^crates/ibuilder-cli/tests/shaders_glue\.rs$''',
  '''^crates/ibuilder-shaderbuild/tests/fixtures/rt_cases\.json$''',
]

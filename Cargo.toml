[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
rayon = "1.12"
memmap2 = "0.9"
sha2 = "0.11"
lz4_flex = "0.14"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
panic = "abort"

[profile.bench]
inherits = "release"

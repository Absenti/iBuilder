[package]
name = "ibuilder-a64"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "AArch64 instruction encoders (port of dm/tools/nso_asm.py) and a capstone-backed decoder"

[dependencies]
capstone-sys = { version = "0.18", default-features = false, features = ["full", "arch_arm64"] }

[dev-dependencies]
ibuilder-nso = { path = "../ibuilder-nso" }
